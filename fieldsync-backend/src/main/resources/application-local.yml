# ─────────────────────────────────────────────────
#  LOCAL profile — H2 in-memory, no Postgres needed
# ─────────────────────────────────────────────────
spring:
  datasource:
    url: jdbc:h2:mem:fieldsync;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration/h2
    baseline-on-migrate: true

  # H2 web console for debugging
  h2:
    console:
      enabled: true
      path: /h2-console

  # Disable OAuth2 auto-config for local dev (we use dev-login endpoint)
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: disabled
            client-secret: disabled

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.oauth2.client.servlet.OAuth2ClientAutoConfiguration

logging:
  level:
    com.fieldsync: DEBUG
    org.springframework.security: DEBUG
