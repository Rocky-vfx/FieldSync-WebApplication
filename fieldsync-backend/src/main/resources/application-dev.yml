spring:
  # ─── Dev Datasource ───
  datasource:
    url: jdbc:postgresql://localhost:5432/fieldsync
    username: postgres
    password: postgres

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # ─── Dev CORS ───
  # Handled in WebConfig.java

logging:
  level:
    com.fieldsync: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
