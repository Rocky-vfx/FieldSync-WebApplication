databases:
  - name: fieldsync-db
    databaseName: fieldsync
    user: fieldsync_user
    plan: free

services:
  - type: web
    name: fieldsync-backend
    runtime: java
    region: singapore  # closest to India
    plan: free
    rootDir: fieldsync-backend
    buildCommand: ./mvnw clean package -DskipTests
    startCommand: java -jar target/fieldsync-backend-0.0.1-SNAPSHOT.jar
    healthCheckPath: /api/skill-categories
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: fieldsync-db
          property: connectionString
      - key: DATABASE_USERNAME
        fromDatabase:
          name: fieldsync-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: fieldsync-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false   # set manually in Render dashboard
      - key: GOOGLE_CLIENT_SECRET
        sync: false   # set manually in Render dashboard
      - key: ALLOWED_ORIGINS
        sync: false   # set to your Vercel URL, e.g. https://fieldsync.vercel.app
